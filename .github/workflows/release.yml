name: Release

on:
  push:
    tags:
      - 'v*'

# Explicit top-level least-privilege permissions. The release job overrides
# at job level to grant the contents:write it needs for publishing tags.
# Top-level defaults to read-only so any future job we add inherits the
# safest baseline (checkov CKV2_GHA_1).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: Publish Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7

      - name: Cache sbt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/*.sbt', 'project/*.scala') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Run tests
        run: sbt test

      - name: Package
        run: sbt package

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/out/*/scala-*/aura-!(*-build)/aura-!(*-tests).jar
