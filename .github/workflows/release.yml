name: Release

on:
  push:
    tags:
      - 'v*'

# Explicit top-level least-privilege permissions. The release job overrides
# at job level to grant the contents:write it needs for publishing tags.
# Top-level defaults to read-only so any future job we add inherits the
# safest baseline (checkov CKV2_GHA_1).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: Publish Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/*.sbt', 'project/*.scala') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Run tests
        run: sbt test

      - name: Package
        run: sbt package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            modules/*/target/scala-*/aura-*.jar
