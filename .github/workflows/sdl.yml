# Microsoft Security DevOps (MSDO) — runs Guardian toolchain (PoliCheck,
# CredScan, Trivy, Bandit, BinSkim, TemplateAnalyzer, …) on every push to
# `main`, every PR, and weekly to pick up new tool definitions.
#
# Results land in the repo's Security → Code scanning alerts tab as SARIF
# entries, and are also kept as a workflow artifact for the run for offline
# triage. PoliCheck and CredScan are Microsoft-proprietary and require the
# windows-latest runner image.
#
# Action repo + docs: https://github.com/microsoft/security-devops-action
# Microsoft OSS release guidance: https://docs.opensource.microsoft.com/releasing/

name: SDL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC Monday
  workflow_dispatch:

permissions: read-all

jobs:
  msdo:
    name: Microsoft Security DevOps
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write          # Federation to Defender for DevOps

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0 # v1.12.0
        id: msdo
        # No `tools:` filter — let the full Guardian toolset run on the
        # Windows image (PoliCheck, CredScan, BinSkim, Trivy, etc.). Findings
        # surface in the Security tab; tune via .gdn/ suppression files if a
        # tool produces noise we want to silence.

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}

      - name: Upload SARIF as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msdo-sarif
          path: ${{ steps.msdo.outputs.sarifFile }}
          if-no-files-found: warn
