name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

# Explicit top-level least-privilege permissions. Without this, the
# GITHUB_TOKEN defaults to read+write on every scope (checkov CKV2_GHA_1).
# CI only needs to read repo contents to check out and build.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17', '21' ]
    name: Build & Test (Java ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java-version }}

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/*.sbt', 'project/*.scala') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Compile
        run: sbt compile

      - name: Run tests  # 1,100+ tests across all modules
        run: sbt test

      - name: Check formatting
        run: sbt scalafmtCheckAll

  integration:
    runs-on: ubuntu-latest
    needs: build
    name: Integration Tests
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/*.sbt', 'project/*.scala') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Run all module tests
        run: sbt test

      - name: Verify examples compile
        run: sbt auraExamples/compile
