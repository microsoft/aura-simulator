# Microsoft Contributor License Agreement (CLA) enforcement.
#
# When a contributor outside the `dependabot[bot]` / `github-actions[bot]`
# allowlist opens a PR, the action posts a comment asking them to sign the
# Microsoft CLA at https://cla.opensource.microsoft.com. Signatures are
# persisted in `signatures/version1/cla.json` on the default branch; once
# signed, the contributor is recognized on all subsequent PRs to any
# Microsoft repo using the same signature store.
#
# This replaces the legacy `microsoft-cla` GitHub App, which was retired.
# Reference template: https://github.com/microsoft/cates/blob/main/.github/workflows/cla.yml
# CLA Assistant docs: https://github.com/contributor-assistant/github-action

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://cla.opensource.microsoft.com'
          branch: 'main'
          allowlist: dependabot[bot],github-actions[bot]
