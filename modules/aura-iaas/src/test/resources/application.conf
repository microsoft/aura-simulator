pekko {
  loglevel = "WARNING"
  stdout-loglevel = "WARNING"
  log-dead-letters = off
  log-dead-letters-during-shutdown = off

  coordinated-shutdown {
    exit-jvm = off
    run-by-jvm-shutdown-hook = off
  }

  actor {
    default-dispatcher {
      fork-join-executor {
        parallelism-min = 1
        parallelism-max = 4
      }
    }
  }

  test {
    default-timeout = 10s
  }
}
